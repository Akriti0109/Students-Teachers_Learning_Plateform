<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="primarystyle.css">

    <div class="container">

         <div class="item-1"><a href="#" aria-label="Users"><i class="fa-solid fa-users-line"></i></a></div>

        <div class="container-2">
        
            <div class="container-2a">
                <div class="item-2a-1">

                        <i class="fas fa-search"></i>
                    </div>
                </div>
                <div class="item-2a-2 box-0">
                    <div class="dabba"><a href="/Chat/blocked/default/primary.html">Blocked</a></div>

                <div class="item-2a-3 box-3"><a href="/Chat/Request/default/primary.html">Requests</a></div>
            </div>
        

            <div class="container-2b">
              
                <div class="container-2b-1">
                 
                    <div class="item-2b-1-1" >

                        <div class="item-2b-1a" ><img src="/Chat/Request/photo/mitch.jpeg" alt="Mitch"></div>

                        <div class="item-2b-1c"><i class="fa-solid fa-star "></i></div>
                    </div>

                        <div class="item-2b-1a" ><img src="/Chat/Request/photo/kevin.jpeg" alt="Kevin"></div>

                        <div class="item-2b-1c"><i class="fa-solid fa-star"></i></div>
                    </div>


                </div>

                    <div class="container-2b-2-1">

                        <div class="item-2b-2a" ><img src="/Chat/Request/photo/kevin.jpeg" alt="Kevin"></div>
                        <div class="item-2b-2b">Kevin</div>
                        <div class="item-2b-2c"><i class="fa-solid fa-phone"></i></div>
                        <div class="item-2b-2d"><i class="fa-solid fa-video"></i></div>

                    </div>

                    <div class="container-2b-2-2">
                     
                        <div class="chat even">
                            <div class="received">
                                Hey Buddy
                            </div>
                        </div>

                        <div class="chat even">
                            <div class="received">
                                I am Kevin from U.S.A<br>
                                and i just stumbled across your profile<br>
                                and found it intresting.
                            </div>
                        </div>

                        <div class="chat even">
                              
                            <div class="received">
                                would you like to engage?
                            </div>
                        </div>


                    </div>

                    <div class="container-2b-2-3">

                        </div>
                        <div class="item-2b-2-3b"><input type="text" placeholder="..."></div>
                        <div class="item-2b-2-3c"><i class="fa-solid fa-image"></i></div>
                        <div class="item-2b-2-3d"><i class="fa-solid fa-paper-plane"></i></div> -->
                        <div class="item-2b-2-3a"><a href="#">Accept</a></div>
