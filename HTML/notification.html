<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="notification.css">
    <title>Notifications</title>
</head>
<body>
    <div class="index box">
        <div class="profile"><img id="profilepic" src="elon.jpg" alt="Elon Musk"></div>
        <p class="name">Elon Musk</p>

        <div class="flexcontainer">
            <div class="gridcontainer">
                <div class="grid-item 1">HOME</div>
                <div class="grid-item 2">TRENDING</div>
                <div class="grid-item 3">MY NETWORK</div>
                <div class="grid-item 4 selected">NOTIFICATION</div>
                <div class="grid-item 5">SAVED</div>
                <div class="grid-item 6">CREATE</div>
            </div>
        </div>

        <p class="settings">S e t t i n g s</p>

    </div>

    <div class="navbar box">

        <div class="status">
            <p>Notifications</p>
        </div>

        <div class="search">
        <input id="placeh" placeholder="search any topic">
        <button>search</button>
        </div>

    </div>

    <div class="content box">
        <div class="content-container">
            <div class="content-grid">
                <div class="content-item 1 logo">Q</div>
                <div class="content-item 2 options">CHAT</div>
                <div class="content-item 3 options">GROUPS</div>
                <div class="content-item 4 options">COMMUNITIES</div>
            </div>
        </div>

        <div class="content-container-2">
            <div class="content-grid-2">
                <div class="content-item 5 logo">Q</div>
                <div class="content-item 6 options">QUIZ</div>
                <div class="content-item 7 options">LEARNING</div>
                <div class="content-item 8 options">STORE</div>
            </div>
        </div>

        <div class="content-container-3">
            <div class="content-grid-3">
                <div class="content-item 9 logo">Q</div>
                <div class="content-item 10 options">INDUSTRY</div>
                <div class="content-item 11 options">MY EXPERIENCE</div>
                <div class="content-item 12 options">DISCOVERIES</div>
            </div>
        </div>
    </div>

    <div class="mainbox">
        <div class="rectangle">
            <div class="circle1"></div>
