<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./default.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Quiz Home Page</title>
</head>

<body>

    <div class="container">

        <!-- Container 1 -->
        <div class="container-1">
            <div class="container-1-1"><img src="/Quiz/photos/standoutlogo.jpeg" alt="img" id="standoutlogo"></div>

            <div class="container-1-2">
                <div class="item-1-2-1"><i class="fa-solid fa-house"></i></div>
                <div class="item-1-2-2">
                    <div class="search-box">
                        <input type="text" placeholder="Search...">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                <div class="item-1-2-4"><i class="fa-solid fa-bell"></i></div>
                <div class="item-1-2-5"><i class="fa-solid fa-user"></i></div>
            </div>
        </div>

        <!-- Container 2 -->
        <div class="container-2">
            <div class="container-2-1">
                <div class="quick-container">
                    <div class="quick"><img src="#" class="quick-img"></div>
                </div>
                <div class="quick-container">
                    <div class="quick"><img src="#" class="quick-img"></div>
                </div>
                <div class="quick-container">
                    <div class="quick"><img src="#" class="quick-img"></div>
                </div>
                <div class="quick-container">
                    <div class="quick"><img src="#" class="quick-img"></div>
                </div>
            </div>

            <!-- Modified Container 2-2 -->
            <div class="container-2-2">
                <h2 class="topic-heading">TOPIC NAME</h2>
                <p class="question">Q. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer nec odio. Praesent libero.</p>
    
                <div class="options">
                    <label><input type="radio" name="option" value="1"> Option - A</label><br>
                    <label><input type="radio" name="option" value="2"> Option - B</label><br>
                    <label><input type="radio" name="option" value="3"> Option - C</label><br>
                    <label><input type="radio" name="option" value="4"> Option - D</label><br>
                </div>
    
                <div class="button-group">
                    <button class="next-button">Next</button>
                    <button class="submit-button">Submit</button>
                </div>
               
            </div>
        </div>
    </div>

</body>

</html>
