<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StandOut Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="hero" aria-label="StandOut introduction">
            <h1><span class="stand">Stand</span><span class="out">Out</span></h1>
            <p>Your Fun, Fast, and Effective path to<br>career and academic growth.</p>
        </section>

        <section class="login-panel" aria-label="Login form">
            <form class="login-form">
                <div class="box">
                    <label class="sr-only" for="email">Email address or phone number</label>
                    <input type="email" name="email" id="email" placeholder="Email address or phone number" required>

                    <label class="sr-only" for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Password" required>
                </div>

                <button type="submit" class="link">Log In</button>

                <div class="link1">
                    <a href="#">Forgotten Password?</a>
                </div>

                <div class="link2">
                    <a href="domain-selection.html">Create New Account</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
