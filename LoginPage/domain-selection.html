<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Favorite Domains - StandOut</title>
    <style>
        /* Basic page styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }

        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #32cd32;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }

        .domain-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .domain-item {
            text-align: center;
            cursor: pointer;
        }

        .domain-item img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: border-color 0.3s ease;
        }

        .domain-item.selected img {
            border-color: #32cd32;
        }

        .domain-item label {
            display: block;
            margin-top: 8px;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }

        #proceed-btn {
            background-color: #32cd32;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #proceed-btn:disabled {
            background-color: rgb(80, 80, 80);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select Your Favorite Domains</h1>

        <!-- Grid of domains -->
        <div class="domain-grid">
            <div class="domain-item" data-domain="web">
                <img src="/images/web-development-image.jpg" alt="Web Development">
                <label>Web Development</label>
            </div>
            <div class="domain-item" data-domain="app">
                <img src="/images/app_d.jpg" alt="App Development">
                <label>App Development</label>
            </div>
            <div class="domain-item" data-domain="ai">
                <img src="/images/aiml.jpg" alt="AI/ML">
                <label>AI/ML</label>
            </div>
            <div class="domain-item" data-domain="cybersecurity">
                <img src="/images/cybersec.jpg" alt="Cybersecurity">
                <label>Cybersecurity</label>
            </div>
            <div class="domain-item" data-domain="finance">
                <img src="/images/finance.jpg" alt="Finance">
                <label>Finance</label>
            </div>
            <div class="domain-item" data-domain="others">
                <img src="/images/other.jpg" alt="Others">
                <label>Others</label>
            </div>
        </div>

        <button id="proceed-btn" disabled>Proceed</button>
    </div>

    <script>
        const maxSelection = 3;
        const selectedDomains = [];
        const proceedButton = document.getElementById('proceed-btn');
        const domainItems = document.querySelectorAll('.domain-item');

        domainItems.forEach(item => {
            item.addEventListener('click', () => {
                const domain = item.getAttribute('data-domain');

                // Add or remove selection
                if (selectedDomains.includes(domain)) {
                    selectedDomains.splice(selectedDomains.indexOf(domain), 1);
                    item.classList.remove('selected');
                } else if (selectedDomains.length < maxSelection) {
                    selectedDomains.push(domain);
                    item.classList.add('selected');
                }

                // Enable or disable proceed button
                proceedButton.disabled = selectedDomains.length === 0;

                // Toggle selection state for each domain
                if (selectedDomains.length >= maxSelection) {
                    domainItems.forEach(it => {
                        if (!selectedDomains.includes(it.getAttribute('data-domain'))) {
                            it.style.pointerEvents = 'none';
                            it.style.opacity = '0.5';
                        }
                    });
                } else {
                    domainItems.forEach(it => {
                        it.style.pointerEvents = 'auto';
                        it.style.opacity = '1';
                    });
                }
            });
        });

        // Redirect to registration page with selected domains
        proceedButton.addEventListener('click', () => {
            const domainParam = selectedDomains.join(',');
            window.location.href = `registration.html?domains=${domainParam}`;
        });
    </script>
</body>
</html>
